# config_animate.yaml — настройки пайплайна anim (апскейл + видео)

upscale:
  enabled: true
  scale: 2                    # 2 | 4
  model: animevideov3         # animevideov3 | anime_6B
  backend: ncnn_vulkan        # ncnn_vulkan (единственный в MVP)
  gpu_id: 0                   # 0 = AMD iGPU, -1 = CPU fallback в NCNN

harmonize:
  enabled: true
  target_width: 1920
  target_height: 1080
  mode: auto                  # auto | blurred_pillarbox | dominant_color | smart_crop
  blur_sigma: 60
  vignette_strength: 0.7

animation:
  mode: opencv_zoom           # opencv_zoom | opencv_shake | depthflow | static
  duration: 3.0               # секунды
  fps: 24
  intensity: 0.3              # 0.0–1.0
  depthflow_animation: dolly   # zoom | dolly (для mode=depthflow)

render:
  concat_panels: true
  storyboard_name: storyboard.mp4
  codec: libx264
  pix_fmt: yuv420p

paths:
  # Переопределение путей (null = авто из models/anim/)
  esrgan_exe: null
  ffmpeg_exe: null
