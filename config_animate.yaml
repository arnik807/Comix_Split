# config_animate.yaml — настройки пайплайна anim (апскейл + видео)

upscale:
  enabled: true
  backend: realesrgan         # realesrgan | realcugan | span
  scale: 2                    # 2 | 4 (зависит от backend/model)
  model: animevideov3         # см. config/models_registry.yaml
  cugan_noise: -1
  cugan_syncgap: 3
  cugan_weights: models-se
  gpu_id: 0                   # 0 = AMD iGPU, -1 = CPU fallback в NCNN
  tile_size: 0                # 0 = auto; 64/128/256 — меньше швов на AMD Vega

harmonize:
  enabled: true
  target_width: 1920
  target_height: 1080
  mode: auto                  # auto | blurred_pillarbox | dominant_color | smart_crop
  blur_sigma: 60
  vignette_strength: 0.7

animation:
  mode: opencv_zoom           # по умолчанию; в UI/API режим задаётся при каждом запуске
  duration: 3.0               # секунды
  fps: 24
  intensity: 0.3              # 0.0–1.0
  depthflow_animation: dolly   # zoom | dolly (для mode=depthflow)
  tpsmm_driving_video: ""     # путь к driving MP4 — только когда в UI выбран mode=tpsmm
  tpsmm_mode: relative        # relative | standard

render:
  concat_panels: true
  storyboard_name: storyboard.mp4
  codec: libx264
  pix_fmt: yuv420p

paths:
  # Переопределение путей (null = авто из models/anim/)
  esrgan_exe: null
  ffmpeg_exe: null
